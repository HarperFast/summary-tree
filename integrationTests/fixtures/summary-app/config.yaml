# Hosts the summary-tree plugin; agent-memory runs in memory-service. Small sizes so a few memories make a tree.
rest: true

'@harperfast/summary-tree':
  package: '@harperfast/summary-tree'
  mcp: true
  treeMinMembers: 12
  leafClusterSize: 4
  fanout: 2
  topFloor: 2
  dirtyMin: 1
  debounceMs: 1500
  leaseMs: 60000
